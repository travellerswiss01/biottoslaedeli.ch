name: Static site checks

on:
  push:
    branches:
      - fix/website-quality
      - main
  pull_request:

permissions:
  contents: read

jobs:
  site-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run static site checks
        run: npm test
